[package]
name = "emerald-core"
version.workspace = true
edition.workspace = true
publish = false
description = "Engine-independent core of the Emerald browser: settings, session model, themes, importers, focus tools."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
rsa = { version = "0.9", default-features = false, features = ["std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
