[package]
name = "emerald"
version.workspace = true
edition.workspace = true
publish = false
description = "Emerald: a minimal, customizable, ADHD-friendly browser (Rust shell over Chromium/CEF)."
build = "build.rs"

[[bin]]
name = "emerald"
path = "src/main.rs"

[dependencies]
cef = { workspace = true }
emerald-core = { path = "../emerald-core" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
include_dir = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
